version: 2
updates:
  # Python deps for the synaptic subsystem.
  - package-ecosystem: "pip"
    directory: "/synaptic"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
