name: CI

# Lint, format-check, and test the synaptic package. The unit tests are DB-free
# (the live SynapCores path is opt-in via SYNAPTIC_LIVE), so no database or
# container is needed here.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  synaptic:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (pinned, from pyproject)
        run: pip install -e "synaptic[dev]"

      - name: Lint (ruff)
        run: ruff check --config synaptic/pyproject.toml synaptic/

      - name: Format check (ruff)
        run: ruff format --check --config synaptic/pyproject.toml synaptic/

      - name: Test (pytest + coverage)
        run: >-
          python -m pytest synaptic/tests/ -v
          --cov=synaptic --cov-config=synaptic/pyproject.toml
          --cov-report=term-missing --cov-fail-under=80
