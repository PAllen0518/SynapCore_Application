name: CI

# Lint and test the synaptic package. The unit tests are DB-free (the live
# SynapCores path is opt-in via SYNAPTIC_LIVE), so no database is needed here.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  synaptic:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r synaptic/requirements.txt

      - name: Lint (ruff)
        run: ruff check --config synaptic/ruff.toml synaptic/

      - name: Test (pytest)
        run: python -m pytest synaptic/tests/ -v
